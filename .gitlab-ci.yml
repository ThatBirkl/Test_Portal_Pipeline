# What:  GitLab CI job: on a release tag (release/*), push the tag to GitHub and create a branch of the same name
#        on the tag's commit (e.g. tag release/2 -> branch release/2).
# Why:   #X test - repo lives in GitLab, only selected tags go to GitHub. Vercel builds from branches.
# Usage: copy as .gitlab-ci.yml into the GitLab test project. CI/CD variables:
#          GITHUB_TOKEN  fine-grained PAT, only the GitHub test repo, Contents: read/write. Masked (+ Protected).
#          GITHUB_REPO   owner/name of the GitHub test repo.
#        If GITHUB_TOKEN is Protected: protect tags release/* (Settings > Repository > Protected tags).

push-tag-to-github:
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"   # full history; GitHub rejects pushes from a shallow clone
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release\//'
  script:
    - GITHUB_URL="https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    - git push "$GITHUB_URL" "refs/tags/${CI_COMMIT_TAG}"
    - git push "$GITHUB_URL" "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_TAG}"
